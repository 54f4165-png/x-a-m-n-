<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GG88 — Giao diện mô phỏng</title><style>
*{box-sizing:border-box}body{margin:0;background:#020e10;color:#7dffbb;font-family:Consolas,monospace}.shell{max-width:720px;margin:auto;position:relative;line-height:0}.base{display:block;width:100%;height:auto;image-rendering:auto}.layer{position:absolute;line-height:1.25;font-size:clamp(7px,1.65vw,12px);color:#28f996;text-shadow:0 0 6px #06f76a;background:#001819f0;padding:2px 3px}.status{left:56%;top:34.2%;width:12%;text-align:center}.risk{left:56%;top:38.1%;width:9%;text-align:center}.timer{left:56%;top:41.9%;width:12%;text-align:center}.logs{left:7%;top:76.2%;width:55%;height:16%;overflow:hidden;font-size:clamp(7px,1.65vw,12px);line-height:1.65;background:#001012e8}.logs div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.percent{left:73%;top:79.5%;width:15%;text-align:center;font-size:clamp(18px,5vw,33px);font-weight:900;background:#00221dd9}.bar{position:absolute;left:70%;top:91.2%;width:24%;height:1.5%;border-radius:20px;overflow:hidden;background:#02352a;border:1px solid #1cffa0;box-shadow:0 0 8px #00ff7b}.fill{height:100%;width:0;background:linear-gradient(90deg,#00bd62,#62ff7b);box-shadow:0 0 12px #39ff75;transition:width .18s linear}.start{position:absolute;left:16%;top:62.5%;width:69%;height:6%;cursor:pointer;border:0;background:transparent;color:transparent}.start:focus-visible{outline:3px solid white}.hint{position:absolute;left:10%;top:69.1%;width:80%;font-size:clamp(7px,1.5vw,11px);text-align:center;color:#91e6bd;background:#001517df;padding:4px}.active{animation:pulse .7s infinite alternate}@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.4)}}.footer{max-width:720px;margin:8px auto 25px;padding:0 12px;font:12px Arial,sans-serif;color:#8baea7;text-align:center}
</style></head><body><main class="shell"><img class="base" src="gg88-enhanced.png" alt="Giao diện GG88 neon"/><div id="status" class="layer status">CHỜ QUÉT</div><div id="risk" class="layer risk">--</div><div id="timer" class="layer timer">0.0s</div><div id="logs" class="layer logs" aria-live="polite"><div>&gt; Hệ thống mô phỏng sẵn sàng</div><div>&gt; Nhấn BẮT ĐẦU HACK để xem hiệu ứng</div></div><div id="percent" class="layer percent">0%</div><div class="bar"><div id="fill" class="fill"></div></div><button id="start" class="start" aria-label="Bắt đầu hiệu ứng quét mô phỏng">Bắt đầu mô phỏng</button><div class="hint">HIỆU ỨNG MÔ PHỎNG — không quét, xác minh hay hack tài khoản thật</div></main><p class="footer">Ảnh nền được phóng lớn và tăng độ nét từ ảnh gốc 480 × 879. Chi tiết đã mất không thể khôi phục hoàn toàn.</p><script>
(()=>{let timer=null,started=0,step=0;const $=id=>document.getElementById(id),lines=['Khởi tạo mô-đun hiển thị...','Nạp dữ liệu giả lập...','Đồng bộ giao diện neon...','Kiểm tra trạng thái mô phỏng...','Tạo chuỗi dữ liệu demo...','Phân tích tiến trình giả lập...','Cập nhật bảng trạng thái...','Hoàn tất hiệu ứng mô phỏng.'];function tick(){step=Math.min(100,step+1);$('percent').textContent=step+'%';$('fill').style.width=step+'%';$('timer').textContent=((performance.now()-started)/1000).toFixed(1)+'s';$('risk').textContent=step===100?'0%':'--';$('status').textContent=step===100?'DEMO OK':'ĐANG QUÉT';if(step%12===0||step===100){const i=Math.min(lines.length-1,Math.floor(step/12));const d=document.createElement('div');d.textContent='> '+lines[i];$('logs').appendChild(d);$('logs').scrollTop=$('logs').scrollHeight}if(step>=100){clearInterval(timer);timer=null;$('start').classList.remove('active')}}$('start').onclick=()=>{if(timer)clearInterval(timer);step=0;started=performance.now();$('logs').replaceChildren();$('status').textContent='ĐANG QUÉT';$('risk').textContent='--';$('percent').textContent='0%';$('fill').style.width='0%';$('start').classList.add('active');timer=setInterval(tick,85)}})();
</script></body></html>
