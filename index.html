<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GG88 • Giao diện mô phỏng</title><style>*{box-sizing:border-box}html,body{margin:0;background:#020b0e;color:#bfffe9;font-family:Arial,sans-serif}.wrap{position:relative;width:min(100%,720px);margin:auto}.reference{display:block;width:100%;height:auto;user-select:none}.trigger{position:absolute;left:16%;top:64.1%;width:68%;height:5.3%;border:0;background:transparent;cursor:pointer}.trigger:focus-visible{outline:3px solid #00ffa5;outline-offset:2px}.layer{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}.layer.open{display:flex}.dialog{background:#021719;border:1px solid #00fbb6;box-shadow:0 0 28px #00dba970;width:min(94vw,540px);padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#37ffd1;font-weight:800}.close{background:transparent;color:#b8fff0;border:1px solid #00dba9;padding:7px 11px;cursor:pointer}pre{height:240px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#000b0c;border:1px solid #145d54;padding:12px;font:12px/1.7 Consolas,monospace;color:#34ff91}.meter{height:14px;background:#062b2a;border:1px solid #19b68e;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#008a6c,#15ff85);transition:width .16s}.progress{margin:10px 0;text-align:right;font-weight:bold;color:#22ff99}.hint{font-size:12px;color:#a1c9c2;line-height:1.5;margin-top:12px}@media(max-width:500px){pre{height:210px}}</style></head><body><main class="wrap"><img class="reference" src="giao-dien-goc.png" alt="Giao diện GG88 theo ảnh tham chiếu"><button class="trigger" id="start" aria-label="Bắt đầu hiệu ứng quét mô phỏng" title="Chạy hiệu ứng quét mô phỏng"></button></main><div class="layer" id="layer" role="dialog" aria-modal="true" aria-labelledby="title"><section class="dialog"><div class="top"><span id="title">GG88 / MÔ PHỎNG QUÉT HỆ THỐNG</span><button class="close" id="close">ĐÓNG ×</button></div><pre id="terminal" aria-live="off"></pre><div class="meter"><div class="fill" id="fill"></div></div><div class="progress" id="progress">0%</div><p class="hint">Đây chỉ là hiệu ứng trình diễn trên trình duyệt. Không đăng nhập, không quét tài khoản thật, không bypass hệ thống.</p></section></div><script>(()=>{const layer=document.getElementById('layer'),term=document.getElementById('terminal'),fill=document.getElementById('fill'),progress=document.getElementById('progress');let timer;const lines=['[BOOT] Khởi tạo môi trường mô phỏng...','[CORE] Nạp giao diện terminal...','[NET] Tạo dữ liệu kết nối giả lập...','[SCAN] Phân tích các khối dữ liệu mẫu...','[VERIFY] Đối chiếu mẫu kiểm thử...','[SECURITY] Hiển thị kết quả minh họa...','[SYSTEM] Hoàn tất mô phỏng.'];function stop(){clearInterval(timer);layer.classList.remove('open')}document.getElementById('close').onclick=stop;layer.onclick=e=>{if(e.target===layer)stop()};document.addEventListener('keydown',e=>{if(e.key==='Escape')stop()});document.getElementById('start').onclick=()=>{clearInterval(timer);layer.classList.add('open');term.textContent='> GG88 DEMO TERMINAL\n';fill.style.width='0%';progress.textContent='0%';let n=0;timer=setInterval(()=>{n=Math.min(100,n+2);fill.style.width=n+'%';progress.textContent=n+'%';if(n%14===0){term.textContent+=lines[Math.min(lines.length-1,Math.floor(n/14)-1)]+'\n';term.scrollTop=term.scrollHeight}if(n===100){term.textContent+='\n[OK] Hoàn tất hiệu ứng mô phỏng.\n';clearInterval(timer)}},100)}})();</script></body></html>
